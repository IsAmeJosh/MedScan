<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedScan</title>
<style>
  :root {
    --ink:#1c2129; --muted:#6b737d; --faint:#999ea8; --line:#d9dbe0;
    --bg:#f6f7f8; --white:#fff;
    --blue:#2563eb; --blue-light:#e0e9fd; --blue-dark:#1e4fc4;
    --red:#dc2e2e; --red-light:#fde8e8;
    --amber:#b4760c; --amber-light:#fef3d9;
    --green:#16a34a; --green-light:#dcfce7;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,'Inter',system-ui,Segoe UI,Roboto,sans-serif;
        background:#e9ebef; color:var(--ink); display:flex; justify-content:center; }
  .phone { width:100%; max-width:430px; min-height:100vh; background:var(--white);
        display:flex; flex-direction:column; position:relative; }
  .topbar { display:flex; align-items:center; justify-content:space-between;
            padding:18px 20px 8px; }
  .topbar h1 { font-size:22px; margin:0; }
  .topbar .icons { display:flex; gap:14px; align-items:center; }
  .topbar .icon-btn { width:32px; height:32px; border-radius:10px; background:var(--bg);
            display:flex; align-items:center; justify-content:center; text-decoration:none;
            color:var(--ink); font-size:15px; }
  main { flex:1; padding:8px 20px 100px; }
  h2 { font-size:17px; margin:0 0 10px; }
  h3 { font-size:14px; margin:18px 0 8px; color:var(--ink); }
  a { color:var(--blue); text-decoration:none; }
  label { display:block; font-size:12px; font-weight:600; color:var(--muted);
          margin:14px 0 6px; letter-spacing:.02em; text-transform:uppercase; }
  input, select, textarea { width:100%; padding:12px 14px; border:1px solid var(--line);
        border-radius:10px; font:inherit; font-size:14px; background:var(--white); color:var(--ink); }
  textarea { resize:vertical; }
  button, .btn { display:inline-flex; align-items:center; justify-content:center;
        width:100%; background:var(--blue); color:#fff; border:0; padding:14px 24px;
        border-radius:10px; cursor:pointer; font:inherit; font-size:15px; font-weight:600;
        margin-top:14px; text-decoration:none; }
  button.outline { background:var(--white); color:var(--red); border:1.5px solid var(--red); }
  button.ghost { background:var(--bg); color:var(--faint); }
  button.secondary { background:var(--bg); color:var(--ink); }
  button.danger { background:var(--red); }
  button.small { width:auto; padding:8px 16px; font-size:13px; margin-top:0; }
  .msg { padding:12px 14px; border-radius:10px; margin-bottom:14px; font-size:14px; }
  .msg.error { background:var(--red-light); color:#8a1f1f; }
  .msg.success { background:var(--green-light); color:#166534; }
  .card { background:var(--bg); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card.accent { background:var(--blue); color:#fff; padding:20px; border-radius:16px; }
  .card.accent .muted { color:#d9e3fc; }
  .card.accent h3 { color:#fff; }
  .muted { color:var(--muted); font-size:13px; }
  .faint { color:var(--faint); font-size:12px; }
  .pill { display:inline-flex; align-items:center; gap:4px; background:var(--bg);
          color:var(--ink); border-radius:999px; padding:5px 12px; font-size:12px;
          font-weight:600; margin:2px 4px 2px 0; }
  .pill.warn { background:rgba(255,255,255,.25); color:#fff; }
  .pill.amber { background:var(--amber-light); color:var(--amber); }
  .pill.locked { background:var(--bg); color:var(--muted); }
  .stat-row { display:flex; gap:24px; margin:14px 0; }
  .stat-row .stat .faint { color:#d9e3fc; }
  .stat-row .stat .val { font-size:16px; font-weight:700; }
  .row { display:flex; gap:12px; } .row > * { flex:1; }
  .tiles { display:flex; gap:10px; margin:14px 0; }
  .tile { flex:1; text-align:center; text-decoration:none; color:var(--ink); }
  .tile .box { width:52px; height:52px; border-radius:14px; margin:0 auto 6px;
        display:flex; align-items:center; justify-content:center; font-size:20px; }
  .tile .box.green { background:#dcfce7; } .tile .box.red { background:var(--red-light); }
  .tile .box.blue { background:var(--blue-light); } .tile .box.purple { background:#ede9fe; }
  .tile span { font-size:11px; font-weight:600; }
  .list-item { display:flex; align-items:center; justify-content:between; gap:10px;
        background:var(--bg); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
.list-item .body { flex:1; }
.list-item .body strong { display:block; font-size:14px; }
.section-head { display:flex; justify-content:space-between; align-items:center; margin-top:18px; }
.section-head a { font-size:13px; font-weight:600; }
.inline-form { display:inline; }
  .btn-row { display:flex; gap:10px; margin-top:14px; }
  .btn-row button { margin-top:0; }
  .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%);
        width:100%; max-width:430px; background:#fff; border-top:1px solid var(--line);
        display:flex; padding:12px 0 18px; }
  .tabbar a { flex:1; text-align:center; font-size:11px; font-weight:600; color:var(--faint);
        text-decoration:none; }
  .tabbar a.active { color:var(--blue); }
  .empty { color:var(--faint); font-size:13px; padding:10px 0; }
  .modal-overlay { position:fixed; inset:0; background:rgba(20,20,24,.5);
        display:flex; align-items:center; justify-content:center; z-index:10; }
  .modal-overlay.sheet { align-items:flex-end; }
  .modal { background:#fff; border-radius:18px; padding:24px; max-width:340px; width:90%; }
  .modal.sheet { max-width:430px; width:100%; border-radius:20px 20px 0 0; }
  .modal h2 { text-align:center; }
  .modal.sheet h2 { text-align:left; }
  .warn-icon { width:48px; height:48px; border-radius:50%; background:var(--red-light);
        display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:12px; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <h1>{% block title %}MedScan{% endblock %}</h1>
    <div class="icons">
      {% block topbar_icons %}{% endblock %}
    </div>
  </div>
  <main>
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% block tabbar %}{% endblock %}
</div>
</body>
</html>
