{% extends "base.html" %} {% block title %}{% endblock %} {% block content %}
<div
  class="modal-overlay sheet"
  style="position: static; background: none; padding: 0"
>
  <div class="modal sheet" style="padding: 28px 24px; margin: 0 -20px">
    <div class="warn-icon">&#9888;</div>
    <h2>Emergency Access</h2>
    <p class="muted">
      This will be logged and {{ patient.name }} will be notified immediately.
    </p>
    <form method="post">
      {% csrf_token %}
      <label>Reason for emergency access</label>
      <input name="reason" placeholder="e.g. Unconscious patient" required />
      <button type="submit" class="danger">Confirm Emergency Access</button>
    </form>
    <a
      class="btn ghost"
      href="{% url 'dashboard' %}"
      style="margin-top: 10px; text-align: center"
      >Cancel</a
    >
  </div>
</div>
{% endblock %}
