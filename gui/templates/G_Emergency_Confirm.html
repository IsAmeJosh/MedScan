{% extends "G_Base.html" %}
{% block title %}{% endblock %}
{% block content %}
<div class="modal-overlay sheet static">
  <div class="modal sheet flush">
    <div class="warn-icon">&#9888;</div>
    <h2>Emergency Access</h2>
    <p class="muted">This will be logged and {{ patient.name }} will be notified immediately.</p>
    <form method="post">{% csrf_token %}
      <label>Reason for emergency access</label>
      <input name="reason" placeholder="e.g. Unconscious patient" required>
      <button type="submit" class="danger">Confirm Emergency Access</button>
    </form>
    <a class="btn ghost mt-10 text-center" href="{% url 'dashboard' %}">Cancel</a>
  </div>
</div>
{% endblock %}
