{% extends "G_Base.html" %}
{% block content %}
<div class="page-head">
  <h1>Emergency Access</h1>
</div>

<div class="card warn">
  <strong>&#9888; This bypasses patient approval</strong>
  <p class="m-0">Emergency access is logged, and the patient is notified right away.</p>
</div>

<form method="post" class="narrow">{% csrf_token %}
  <label>Patient ID</label>
  {% if patient %}
    <input value="{{ patient.display_id }} &middot; {{ patient.name }}" readonly>
  {% else %}
    <input name="patient_id" placeholder="PT-2026-01001" value="{{ form.patient_id|default:'' }}" required autofocus>
  {% endif %}
  <label>Reason for emergency access</label>
  <textarea name="reason" rows="3" placeholder="e.g. Patient unconscious on arrival, ER" required>{{ form.reason|default:'' }}</textarea>
  <div class="btn-row">
    <button type="submit" class="danger">Access Record Now</button>
    <a class="btn secondary" href="{% url 'dashboard' %}">Cancel</a>
  </div>
</form>
{% endblock %}
