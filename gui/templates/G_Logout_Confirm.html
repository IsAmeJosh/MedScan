{% extends "G_Base.html" %}
{% block content %}
<div class="card white narrow">
  <h2>Log out of MedScan?</h2>
  <p class="muted">You will need your ID and password to come back.</p>
  <div class="btn-row">
    <a class="btn secondary" href="{% url 'dashboard' %}">Cancel</a>
    <form method="post" class="inline-form">{% csrf_token %}
      <button type="submit" class="danger">Log Out</button>
    </form>
  </div>
</div>
{% endblock %}
