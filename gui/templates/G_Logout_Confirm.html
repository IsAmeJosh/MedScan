{% extends "G_Base.html" %}
{% block title %}Log out{% endblock %}
{% block content %}
<div class="center-page"><div class="card center-card">
  <div class="card-b">
    <span class="ic gray sq">{% icon "logout" %}</span>
    <h2 class="mt-16 name-lg">Log out of MedScan?</h2>
    <p class="muted mt-8">You will need your ID and password to come back.</p>
  </div>
  <div class="card-foot">
    <a class="btn ghost" href="{% url 'dashboard' %}">Cancel</a>
    <form method="post" class="inline-form">{% csrf_token %}
      <button type="submit" class="danger">{% icon "logout" "sm" %}Log out</button>
    </form>
  </div>
</div></div>
{% endblock %}
