{# The password box of the sign-up forms: a Show / Hide word, and a Caps Lock warning. #}
<div class="field">
  <label for="password">Password</label>
  <div class="input pw-wrap">
    <input id="password" name="password" type="password" minlength="6" maxlength="25" required
           autocomplete="new-password" data-toggle-password data-min="6"
           data-validate="password" data-hint="6 to 25 characters." placeholder="At least 6 characters"><button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false"><span class="eye-on">Show</span><span class="eye-off">Hide</span></button>
  </div>
  <p class="caps-note" hidden>Caps Lock is on</p>
</div>
