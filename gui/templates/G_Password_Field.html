{# The password box of the sign-up forms: counter, show/hide eye, Caps Lock warning. #}
<div class="field">
  <label for="password">Password</label>
  <div class="input pw-wrap">
    <input id="password" name="password" type="password" minlength="6" maxlength="25" required
           autocomplete="new-password" data-toggle-password data-counter data-min="6"
           data-validate="password" data-hint="6 to 25 characters." placeholder="At least 6 characters"><button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false"><span class="eye-on">{% icon "eye" "sm" %}</span><span class="eye-off">{% icon "eyeoff" "sm" %}</span></button>
  </div>
  <p class="caps-note" hidden>Caps Lock is on</p>
</div>
