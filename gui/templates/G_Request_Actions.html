{% comment %} Decline and Allow for one waiting request. Needs: r (the request), doctor, and next (the page to come back to). The two look
   identical on purpose, so neither is the nudged choice. Allow opens the review sheet, which says what the doctor would see. {% endcomment %}
<form method="post" action="{% url 'respond' r.request_id 'deny' %}" class="inline-form" data-confirm="Dr. {{ doctor.name }} will be told you said no. They can ask again later." data-confirm-title="Decline this request?" data-confirm-button="Decline request" data-confirm-tone="danger">{% csrf_token %}
  <input type="hidden" name="next" value="{{ next|default:'dashboard' }}">
  <button type="submit" class="btn equal">Decline</button>
</form>
<button type="button" class="btn equal" data-sheet="review-{{ r.request_id }}">Allow</button>
